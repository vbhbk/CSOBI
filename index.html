<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0B0F">
<meta name="description" content="CSOBi — clickable concept prototype of a digital banking brand for young people. All data is fictional.">
<title>ČSOBi · Concept prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0A0B0F; --card:#14161D; --card2:#1C1F28; --card3:#242835;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#F4F5F8; --muted:#A3A9B7; --dim:#8A90A0;
  --or1:#FF7A1A; --or2:#FFB23F; --grad:linear-gradient(135deg,#FF7A1A 0%,#FFB23F 100%);
  --mint:#3DFFA2; --red:#FF5C7A; --blue:#5B8CFF; --pink:#FF5FA2; --purple:#9B7BFF;
  --st:50px; --sb:30px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --fh:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fb:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#050608;color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px;border-radius:12px}
b,strong{font-weight:600}

/* ============ STAGE & PHONE ============ */
#stage{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(1100px 700px at 75% 0%,rgba(255,122,26,.13),transparent 60%),
             radial-gradient(900px 600px at 0% 100%,rgba(61,255,162,.06),transparent 60%),#050608}
.device{position:relative;width:390px;height:844px;border-radius:56px;flex:none;transform-origin:center center;
  box-shadow:0 0 0 10px #15171d,0 0 0 11.5px #343844,0 0 0 13px #0b0c10,0 60px 140px -20px rgba(0,0,0,.85),0 0 180px rgba(255,122,26,.10)}
.device::before,.device::after{content:'';position:absolute;width:4px;border-radius:3px;background:#2b2e37}
.device::before{left:-17px;top:170px;height:60px;box-shadow:0 80px 0 #2b2e37,0 -60px 0 -0px #2b2e37}
.device::after{right:-17px;top:220px;height:96px}
.screen{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#000;isolation:isolate;contain:layout paint}
#views{position:absolute;inset:0;overflow:hidden;background:#000}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:200;pointer-events:none}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:150;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 40px;pointer-events:none;font:600 15px var(--fh);letter-spacing:-.2px}
.sbar .si{display:flex;gap:6px;align-items:center}
.hind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);z-index:200;pointer-events:none}
.caption{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#6d7383;font-size:13px;letter-spacing:.2px;pointer-events:none}
.caption b{color:#a3a9b7;font-weight:600}

@media (max-width:520px),(max-height:620px) and (pointer:coarse){
  :root{--st:max(env(safe-area-inset-top),14px);--sb:max(env(safe-area-inset-bottom),10px)}
  #stage{display:block}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}
  .device::before,.device::after,.sbar,.island,.hind,.caption{display:none}
}

/* ============ VIEWS ============ */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-top:var(--st);display:flex;flex-direction:column;
  scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:-24px 0 48px rgba(0,0,0,.45)}
.view::-webkit-scrollbar{display:none}
.view.has-tab{padding-bottom:calc(var(--sb) + 84px)}
.view.under{visibility:hidden}
.view>*{flex-shrink:0}
.grow{flex:1 0 auto}
.pad{padding-left:20px;padding-right:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .pos{color:var(--mint)} .neg{color:var(--red)} .orc{color:var(--or2)}
.small{font-size:13px} .center{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h1{font:700 28px/1.15 var(--fh);letter-spacing:-.6px}
.h2{font:700 22px/1.2 var(--fh);letter-spacing:-.4px}
.h3{font:600 17px/1.25 var(--fh);letter-spacing:-.2px}
.lbl{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.1px}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px;font:600 17px var(--fh);letter-spacing:-.2px}
.sec-t .link{font-family:var(--fb)}
.big{font:700 44px/1 var(--fh);letter-spacing:-1.6px;font-variant-numeric:tabular-nums}
.big.md{font-size:34px;letter-spacing:-1.1px}
.big.sm{font-size:26px;letter-spacing:-.7px}
.cur{font:600 20px var(--fh);color:var(--muted);margin-left:6px}
.bal{display:flex;align-items:baseline}
.disc{font-size:13px;color:var(--dim);line-height:1.45}
.ic{flex:none;display:block}

/* header */
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 12px}
.hb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card2);border:1px solid var(--line)}
.hb.ghost{background:none;border-color:transparent}
.ht{flex:1;text-align:center;font:600 17px var(--fh);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabtitle{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 4px;min-height:56px}
.tabtitle h1{font:700 30px var(--fh);letter-spacing:-.8px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;background:var(--grad);color:#1B0E00;
  font:700 16px var(--fh);letter-spacing:-.1px;box-shadow:0 12px 32px -10px rgba(255,122,26,.7),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s var(--ease),opacity .2s;text-align:center;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.mint{background:var(--mint);color:#00240F;box-shadow:0 12px 30px -12px rgba(61,255,162,.7)}
.btn.red{background:var(--red);color:#fff;box-shadow:none}
.btn.dark{background:#000;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.btn.light{background:#fff;color:#111;box-shadow:none}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.45}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--or2);font-weight:600;font-size:14px}
.cta{position:sticky;bottom:0;z-index:5;padding:16px 20px calc(var(--sb) + 12px);background:linear-gradient(180deg,rgba(10,11,15,0),var(--bg) 30%)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;border:1px solid var(--line)}
.pill.or{background:rgba(255,122,26,.14);color:var(--or2);border-color:rgba(255,122,26,.25)}
.pill.mint{background:rgba(61,255,162,.12);color:var(--mint);border-color:rgba(61,255,162,.22)}
.pill.red{background:rgba(255,92,122,.12);color:var(--red);border-color:rgba(255,92,122,.25)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;position:relative}
.card+.card{margin-top:12px}
.card.c2{background:var(--card2)}
.glow-or{box-shadow:0 0 0 1px rgba(255,122,26,.35),0 18px 50px -20px rgba(255,122,26,.55)}

/* list rows */
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 0;width:100%;text-align:left;cursor:pointer}
.li+.li{border-top:1px solid var(--line)}
.li .ico{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--text)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.li .r{text-align:right;flex:none}
.li .r b{display:block;font:600 15px var(--fh);font-variant-numeric:tabular-nums}
.li .r small{display:block;font-size:13px;margin-top:2px}
.li .chev{color:var(--dim)}

/* toggle */
.tg{width:52px;height:32px;border-radius:16px;background:#3a3e4a;position:relative;flex:none;transition:background .25s}
.tg i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .28s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.on>.tg,.tg.on{background:var(--or1)}
.on>.tg i,.tg.on i{transform:translateX(20px)}

/* segmented */
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);text-align:center;transition:background .2s,color .2s}
.seg button.on{background:var(--card3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* range */
.range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;--p:30%;touch-action:pan-y}
.range::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--or1),var(--or2)) 0/var(--p) 100% no-repeat,#2a2e39}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 0 0 7px rgba(255,122,26,.22),0 4px 14px rgba(0,0,0,.5)}
.range::-moz-range-track{height:8px;border-radius:4px;background:#2a2e39}
.range::-moz-range-progress{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--or1),var(--or2))}
.range::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,122,26,.22)}
.range-l{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:-4px}

/* bars */
.bar{height:10px;border-radius:6px;background:#262a35;overflow:hidden;position:relative}
.bar.lg{height:14px;border-radius:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--grad);transition:width .6s var(--ease)}
.bar i.ghost{background:repeating-linear-gradient(-45deg,rgba(255,178,63,.35) 0 6px,rgba(255,178,63,.18) 6px 12px)}
.bar i.mint{background:linear-gradient(90deg,#1FCB86,var(--mint))}

/* steps */
.steps{display:flex;gap:6px;padding:4px 20px 0}
.steps i{flex:1;height:4px;border-radius:2px;background:#2a2e39;overflow:hidden;position:relative}
.steps i.done{background:var(--or1)}
.steps i.cur::after{content:'';position:absolute;inset:0;background:var(--grad);transform-origin:left;animation:stepfill .7s var(--ease) both}
@keyframes stepfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.steplbl{padding:10px 20px 0;font-size:13px;color:var(--muted);font-weight:500}

/* avatars */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--fh);color:#fff;flex:none;position:relative;background:linear-gradient(135deg,var(--a1),var(--a2))}
.av.lg{width:64px;height:64px;font-size:24px}
.av.xl{width:96px;height:96px;font-size:36px}
.av-me{--a1:#FF7A1A;--a2:#FF5FA2;box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(255,178,63,.8)}
.kav{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2b2f3d,#171922);display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--line2)}
.kav svg{margin-top:6px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;display:flex;padding:6px 6px calc(var(--sb) + 0px);background:rgba(13,14,19,.8);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-top:1px solid var(--line);transition:transform .38s var(--ease)}
.tabbar.hide{transform:translateY(110%)}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8C92A2;font:600 13px var(--fb);letter-spacing:-.1px;transition:color .2s;text-align:center}
.tab .ic{transition:transform .3s var(--ease),filter .3s}
.tab.on{color:#fff}
.tab.on .ic{color:var(--or1);filter:drop-shadow(0 0 10px rgba(255,122,26,.7));transform:translateY(-1px)}

/* sheet */
.sheet{position:absolute;inset:0;z-index:120;pointer-events:none}
.sheet.open{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .35s}
.sheet.open .sheet-bg{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;scrollbar-width:none;background:linear-gradient(180deg,#1A1D26,#14161D);border-radius:30px 30px 0 0;
  border-top:1px solid rgba(255,255,255,.1);padding:10px 20px calc(var(--sb) + 18px);transform:translateY(105%);transition:transform .42s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet.open .sheet-panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 16px}
.sheet h3{font:700 21px var(--fh);letter-spacing:-.4px;margin-bottom:6px}

/* toast */
.toast{position:absolute;top:calc(var(--st) + 6px);left:50%;transform:translate(-50%,-24px);opacity:0;z-index:160;pointer-events:none;
  background:rgba(32,35,45,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);padding:11px 16px 11px 12px;border-radius:18px;
  font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;width:max-content;max-width:350px;transition:transform .4s var(--ease),opacity .3s;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(61,255,162,.16);color:var(--mint);flex:none}
.toast.warn .ti{background:rgba(255,92,122,.16);color:var(--red)}
.toast.or .ti{background:rgba(255,122,26,.16);color:var(--or2)}

/* ============ DEMO PANEL ============ */
#demoBtn{position:fixed;top:16px;right:16px;z-index:500;min-height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:#c9cdd6;font:600 13px var(--fb);display:flex;align-items:center;gap:6px;opacity:.75;transition:opacity .2s}
#demoBtn:hover{opacity:1}
#demoBtn i{width:7px;height:7px;border-radius:50%;background:var(--or1);box-shadow:0 0 8px var(--or1)}
.demo{position:fixed;top:60px;right:16px;z-index:510;width:320px;max-height:calc(100vh - 80px);overflow-y:auto;background:rgba(22,24,31,.97);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:opacity .25s,transform .25s var(--ease);scrollbar-width:thin}
.demo.open{opacity:1;transform:none;pointer-events:auto}
.demo-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.demo-h b{font:700 16px var(--fh)}
.demo-h small{display:block;color:var(--dim);font-size:13px;font-weight:400}
.dbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px;margin-top:8px}
.dbtn:hover{background:var(--card3)}
.dbtn kbd{margin-left:auto;font:600 13px var(--fb);color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:1px 7px}
.dbtn .ic{color:var(--or2)}
.demo-l{margin:16px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{min-height:34px;padding:0 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:500}
.jump button:hover{border-color:rgba(255,122,26,.5)}
.demo-state{margin-top:14px;font-size:13px;color:var(--dim);line-height:1.5;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:520px),(max-height:620px) and (pointer:coarse){
  #demoBtn{top:calc(var(--st) + 140px);bottom:auto;right:0;width:22px;min-height:64px;padding:0;border-radius:10px 0 0 10px;opacity:.5;font-size:13px;border-right:0;background:rgba(20,22,29,.9);writing-mode:vertical-rl;justify-content:center;letter-spacing:1px}
  #demoBtn::before{content:'';position:absolute;inset:-6px -4px -6px -18px}
  #demoBtn i{display:none}
  .demo{top:auto;bottom:0;right:0;left:0;width:auto;border-radius:24px 24px 0 0;max-height:80vh;padding-bottom:calc(var(--sb) + 16px)}
}

/* ============ KAMIL ============ */
.kamil{display:block;overflow:visible}
.kamil .k-arm{transform-box:view-box;transform-origin:160px 132px}
.kamil .k-lid{transform-box:view-box;transform-origin:113px 57px;transform:scaleY(0);animation:kblink 5s infinite 1.2s}
.kamil .k-shirt{transition:fill .45s ease}
.kamil .k-skin{transition:fill .6s ease,stroke .6s ease}
.kamil.wave .k-arm{animation:kwave 1.8s ease-in-out infinite}
.kamil.idle{animation:kbob 3.6s ease-in-out infinite}
.kamil .k-tail{transform-box:view-box;transform-origin:160px 196px;animation:ktail 4s ease-in-out infinite}
.kamil.celebrate{animation:kjump .9s cubic-bezier(.3,1.5,.5,1) 2}
.kamil.celebrate .k-arm{animation:kwave .7s ease-in-out infinite}
@keyframes kwave{0%,100%{transform:rotate(0)}20%{transform:rotate(-22deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-16deg)}80%{transform:rotate(4deg)}}
@keyframes kblink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
@keyframes kbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ktail{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes kjump{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-22px) scale(1.03,.97)}60%{transform:translateY(0) scale(1.04,.94)}}

/* ============ SPLASH & ONBOARDING ============ */
.splash{background:radial-gradient(500px 420px at 50% 34%,rgba(255,122,26,.22),transparent 70%),radial-gradient(400px 300px at 80% 90%,rgba(61,255,162,.07),transparent 70%),var(--bg);text-align:center;align-items:center}
.splash .kwrap{margin-top:7vh;position:relative}
@media (min-height:700px){.splash .kwrap{margin-top:56px}}
.splash .ring{position:absolute;left:50%;top:52%;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;border:1px dashed rgba(255,178,63,.25);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wordmark{font:800 56px/1 var(--fh);letter-spacing:-2.4px;margin-top:10px}
.wordmark .i{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.tagline{font:500 18px var(--fh);color:var(--muted);margin-top:10px;letter-spacing:-.2px}
.tagline span{color:var(--text)}
.ipills{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;padding:0 20px}
.splash .cta{background:none;width:100%}
.btn.enter{min-height:62px;font-size:19px;border-radius:22px}
.newhere{display:block;width:100%;text-align:center;min-height:48px;margin-top:10px;font-size:14px;color:var(--muted)}
.newhere u{color:var(--or2);text-decoration:none;font-weight:600}
.bank-list .li .ico{font:700 15px var(--fh);color:#fff}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;min-height:48px;width:100%;text-align:left;font-size:14px;color:var(--muted)}
.chk .box{width:24px;height:24px;border-radius:8px;border:2px solid #4a4f5d;display:grid;place-items:center;flex:none;transition:.2s;color:transparent}
.chk.on .box{background:var(--or1);border-color:var(--or1);color:#1B0E00}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.spinner{width:56px;height:56px;border-radius:50%;border:4px solid rgba(255,255,255,.1);border-top-color:var(--or1);animation:spin .8s linear infinite;margin:10px auto}
.ready-card{animation:cardIn 1s var(--ease) .3s both}
@keyframes cardIn{from{opacity:0;transform:translateY(60px) rotateX(40deg) scale(.9)}to{opacity:1;transform:none}}

/* ============ HOME ============ */
.top{display:flex;align-items:center;gap:12px;padding:8px 20px 4px;min-height:60px}
.top .hello{flex:1;line-height:1.2}
.top .hello span{display:block;font-size:13px;color:var(--muted)}
.top .hello b{font:700 21px var(--fh);letter-spacing:-.4px}
.icb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);position:relative}
.icb .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--or1);box-shadow:0 0 0 2px var(--card),0 0 10px var(--or1)}
.search{display:flex;align-items:center;gap:10px;margin:10px 20px 0;min-height:46px;padding:0 14px;border-radius:15px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:15px;width:calc(100% - 40px)}
.acc{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 20px 4px;scroll-padding:0 20px;scrollbar-width:none;cursor:grab}
.acc::-webkit-scrollbar{display:none}
.acc.drag{scroll-snap-type:none;cursor:grabbing}
.acc-card{flex:0 0 84%;scroll-snap-align:start;border-radius:28px;padding:20px;min-height:178px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1F2231 0%,#14161D 70%);border:1px solid var(--line2);user-select:none}
.acc-card::before{content:'';position:absolute;width:240px;height:240px;right:-80px;top:-110px;border-radius:50%;background:radial-gradient(circle,var(--gl,rgba(255,122,26,.35)),transparent 65%);pointer-events:none}
.acc-card.pk{--gl:rgba(61,255,162,.25)} .acc-card.kd{--gl:rgba(255,95,162,.28)}
.acc-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.acc-top .ai{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--text)}
.acc-sub{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dots{display:flex;justify-content:center;gap:2px;margin-top:4px}
.dots button{width:30px;height:30px;display:grid;place-items:center}
.dots button i{width:7px;height:7px;border-radius:4px;background:#3a3e4a;transition:width .3s,background .3s}
.dots button.on i{width:22px;background:var(--or1)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 20px 0}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);text-align:center;min-height:84px}
.qa .q{width:58px;height:58px;border-radius:20px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);transition:transform .15s}
.qa button:first-child .q{background:var(--grad);color:#1B0E00;border:0;box-shadow:0 10px 26px -10px rgba(255,122,26,.8)}
.qa button:active .q{transform:scale(.92)}
.banner{display:flex;gap:14px;align-items:center;margin:16px 20px 0;padding:16px;border-radius:24px;width:calc(100% - 40px);text-align:left;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(255,122,26,.22),rgba(255,178,63,.08) 60%,rgba(20,22,29,.6)),var(--card);border:1px solid rgba(255,122,26,.35);box-shadow:0 18px 40px -22px rgba(255,122,26,.7)}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite 1s}
@keyframes shine{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
.banner .bi{width:48px;height:48px;border-radius:16px;background:var(--grad);color:#1B0E00;display:grid;place-items:center;flex:none}
.banner small{display:block;font-size:13px;color:var(--or2);font-weight:600}
.banner b{display:block;font:600 16px/1.3 var(--fh);letter-spacing:-.2px;margin-top:2px}
.banner span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.tip{display:flex;gap:12px;align-items:center;margin:12px 20px 0;padding:14px 16px 14px 8px;border-radius:24px;width:calc(100% - 40px);text-align:left;
  background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 18%,transparent),transparent 70%),var(--card);border:1px solid color-mix(in srgb,var(--tc) 30%,transparent);transition:background .6s,border-color .6s}
.tip .tl{font-size:13px;font-weight:600;color:var(--tc);display:flex;align-items:center;gap:6px;transition:color .6s}
.tip p{font-size:14px;margin-top:3px;line-height:1.4}
.tip .kw{width:76px;height:70px;flex:none;display:grid;place-items:center}
.day{font-size:13px;color:var(--dim);font-weight:600;margin:16px 0 2px}
.ru{color:var(--mint);font-size:13px}

/* ============ PAYMENTS ============ */
.note{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:20px;background:rgba(61,255,162,.07);border:1px solid rgba(61,255,162,.2);font-size:14px}
.note .ni{width:38px;height:38px;border-radius:12px;background:rgba(61,255,162,.14);color:var(--mint);display:grid;place-items:center;flex:none}
.contacts{display:flex;gap:14px;overflow-x:auto;padding:4px 20px 6px;scrollbar-width:none}
.contacts::-webkit-scrollbar{display:none}
.contacts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:62px;text-align:center}
.contacts .av{width:58px;height:58px;font-size:21px}
.contacts .new{width:58px;height:58px;border-radius:50%;border:1.5px dashed #4a4f5d;display:grid;place-items:center;color:var(--or2)}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptile{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.ptile .pi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card2)}
.ptile b{font:600 16px var(--fh);letter-spacing:-.2px}
.ptile small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ptile.hl{background:linear-gradient(150deg,rgba(255,122,26,.2),var(--card) 70%);border-color:rgba(255,122,26,.3)}
.ptile.hl .pi{background:var(--grad);color:#1B0E00}
.amt-disp{text-align:center;padding:12px 0 4px}
.amt-disp .big{font-size:60px;letter-spacing:-2.5px}
.amt-disp .cur{font-size:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.5);color:var(--or2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 20px 0}
.keypad button{min-height:56px;border-radius:16px;font:600 24px var(--fh);text-align:center;display:grid;place-items:center;transition:background .15s}
.keypad button:active{background:var(--card2)}
.fly{align-self:stretch;position:relative;height:120px;margin:30px 20px 0;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.fly .av{width:72px;height:72px;font-size:28px;z-index:2}
.fly .track{position:absolute;left:90px;right:90px;top:50%;border-top:2px dashed rgba(255,255,255,.15)}
.fly .coin{position:absolute;left:84px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:var(--grad);box-shadow:0 0 20px var(--or1);animation:coinfly .9s cubic-bezier(.5,0,.3,1) .3s both}
@keyframes coinfly{0%{transform:translateX(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateX(196px) scale(1);opacity:0}}
.fly .tick{position:absolute;right:4px;top:50%;margin-top:-46px;width:30px;height:30px;border-radius:50%;background:var(--mint);color:#00240F;display:grid;place-items:center;z-index:3;animation:pop .5s cubic-bezier(.3,1.6,.5,1) 1.15s both}
.fly .ringok{position:absolute;right:10px;top:50%;width:72px;height:72px;margin-top:-36px;border-radius:50%;box-shadow:0 0 0 3px var(--mint);animation:ringok .7s ease-out 1.1s both;z-index:1}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ringok{0%{opacity:0;transform:scale(.8)}50%{opacity:1}100%{opacity:1;transform:scale(1.12)}}
.fadeup{animation:fadeup .6s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.75s}.d12{animation-delay:1.3s}.d14{animation-delay:1.5s}
.qrcam{position:relative;margin:8px 20px 0;height:380px;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 30% 30%,#2a2420,#0f1013 70%)}
.qrcam .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.5}
.qrcam .frame{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px}
.qrcam .frame i{position:absolute;width:44px;height:44px;border:4px solid var(--or1);border-radius:6px}
.qrcam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.qrcam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.qrcam .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.qrcam .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.qrcam .scan{position:absolute;left:14px;right:14px;height:3px;top:14px;background:var(--or2);box-shadow:0 0 18px 4px rgba(255,122,26,.6);border-radius:2px;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:203px}}
.qrcam .ghostqr{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;opacity:.55;filter:blur(.4px);transform:rotate(-6deg)}
.qrcam .hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:14px;color:#d9dce4}
.qrres{margin:-80px 0 0;position:relative;z-index:3}
.myqr{background:#fff;border-radius:28px;padding:22px;width:260px;margin:12px auto 0;box-shadow:0 20px 60px rgba(255,122,26,.25)}

/* ============ INVEST ============ */
.hero-inv{position:relative;margin:4px 20px 0;padding:24px 20px 20px;border-radius:30px;overflow:hidden;background:radial-gradient(360px 220px at 80% 20%,rgba(255,122,26,.32),transparent 70%),linear-gradient(160deg,#1E2130,#14161D);border:1px solid var(--line2)}
.hero-inv .kpos{position:absolute;right:-16px;bottom:-18px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.feat+.feat{border-top:1px solid var(--line)}
.feat .fi{width:40px;height:40px;border-radius:13px;background:rgba(255,122,26,.13);color:var(--or2);display:grid;place-items:center;flex:none}
.feat b{display:block;font-size:15px}
.feat small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.goal{display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:24px;background:var(--card);border:1.5px solid var(--line);text-align:left;transition:border-color .25s,box-shadow .25s,background .25s}
.goal+.goal{margin-top:12px}
.goal .gi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--card2);flex:none;transition:.25s}
.goal b{display:block;font:600 18px var(--fh);letter-spacing:-.3px}
.goal small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.goal .gr{margin-left:auto;text-align:right}
.goal .gr b{font-size:16px;white-space:nowrap}
.center>.kamil,.center>svg.kamil,.center>.av{margin-left:auto;margin-right:auto}
.goal .radio{width:24px;height:24px;border-radius:50%;border:2px solid #4a4f5d;flex:none;display:grid;place-items:center;transition:.25s}
.goal.on{border-color:var(--or1);background:linear-gradient(120deg,rgba(255,122,26,.12),var(--card) 70%);box-shadow:0 14px 40px -20px rgba(255,122,26,.8)}
.goal.on .gi{background:var(--grad);color:#1B0E00}
.goal.on .radio{border-color:var(--or1);background:var(--or1);box-shadow:inset 0 0 0 4px var(--card)}
.goalpill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.goalpill .ic{color:var(--or2)}
.brk{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.brk .row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.brk .tot{font-weight:700}
.hint{margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(255,178,63,.08);color:var(--or2);font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}
.hint.ok{background:rgba(61,255,162,.08);color:var(--mint)}
.trow{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0;width:100%;text-align:left;cursor:pointer}
.trow+.trow{border-top:1px solid var(--line)}
.trow .t{flex:1}
.trow .t b{display:block;font-size:15px}
.trow .t small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.trow .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card2);flex:none}
.taxbig{font:700 40px var(--fh);letter-spacing:-1.4px;background:linear-gradient(135deg,#9BFFD0,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.qcard{animation:qin .45s var(--ease) both}
@keyframes qin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 16px;border-radius:18px;background:var(--card2);border:1.5px solid var(--line);font-size:15px;font-weight:500;text-align:left;transition:.2s}
.opt+.opt{margin-top:10px}
.opt .ol{width:30px;height:30px;border-radius:10px;background:var(--card3);display:grid;place-items:center;font:700 14px var(--fh);flex:none;color:var(--muted)}
.opt:active,.opt.on{border-color:var(--or1);background:rgba(255,122,26,.1)}
.qdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.qdots i{width:8px;height:8px;border-radius:50%;background:#3a3e4a}
.qdots i.on{background:var(--or1)}
.mix{display:flex;gap:18px;align-items:center}
.legend{flex:1;display:flex;flex-direction:column;gap:10px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend b{margin-left:auto;font-family:var(--fh);white-space:nowrap;padding-left:6px}
.legend div{font-size:13px}
.sum .row{min-height:48px;border-bottom:1px solid var(--line);font-size:14px}
.sum .row:last-child{border-bottom:0}
.sum .row span:first-child{color:var(--muted)}
.sum .row span:last-child{font-weight:600;text-align:right}
.hold{position:relative;width:100%;min-height:64px;border-radius:22px;background:#2a1a0e;border:1.5px solid rgba(255,122,26,.5);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;
  font:700 17px var(--fh);color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;box-shadow:0 14px 40px -16px rgba(255,122,26,.8)}
.hold .hold-fill{position:absolute;inset:0;background:var(--grad);transform:scaleX(0);transform-origin:left}
.hold .hold-in{position:relative;display:flex;align-items:center;gap:10px;transition:color .2s}
.hold.holding .hold-in,.hold.full .hold-in{color:#1B0E00}
.hold .hold-ring{width:28px;height:28px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;opacity:.9}
.hold.holding{animation:holdpulse .5s ease-in-out infinite alternate}
@keyframes holdpulse{to{box-shadow:0 0 0 6px rgba(255,122,26,.18),0 14px 40px -10px rgba(255,122,26,.9)}}
.success{text-align:center;align-items:center;background:radial-gradient(420px 380px at 50% 30%,rgba(61,255,162,.16),transparent 70%),var(--bg)}
.success .cta{width:100%;background:none}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:130}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px}
/* pocket */
.pv{padding:20px;border-radius:28px;background:linear-gradient(165deg,#1E2231,#14161D 75%);border:1px solid var(--line2);position:relative;overflow:hidden}
.pv::before{content:'';position:absolute;width:300px;height:300px;right:-120px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(61,255,162,.18),transparent 65%)}
.pv.dn::before{background:radial-gradient(circle,rgba(255,92,122,.2),transparent 65%)}
.pv .spark{display:block;width:100%;height:96px;margin-top:10px}
.pv .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pv .stats div{background:rgba(255,255,255,.04);border-radius:16px;padding:10px 12px}
.pv .stats small{display:block;font-size:13px;color:var(--muted)}
.pv .stats b{font:600 17px var(--fh);font-variant-numeric:tabular-nums}
.alert{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:24px;background:linear-gradient(120deg,rgba(255,92,122,.18),rgba(255,92,122,.05)),var(--card);border:1px solid rgba(255,92,122,.4);animation:fadeup .5s var(--ease) both}
.alert .ai2{width:40px;height:40px;border-radius:13px;background:rgba(255,92,122,.2);color:var(--red);display:grid;place-items:center;flex:none}
.alert b{display:block;font:600 16px var(--fh);color:#FFD5DD}
.alert p{font-size:14px;color:#E7C9D0;margin-top:4px}
.streak{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:14px 0 10px}
.streak i{aspect-ratio:1;border-radius:50%;background:#262a35;border:1px solid var(--line);transition:background .4s,box-shadow .4s}
.streak i.on{background:var(--grad);border-color:transparent;box-shadow:0 0 10px rgba(255,122,26,.55)}
.streak i.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.raise{background:linear-gradient(130deg,rgba(255,122,26,.25),rgba(255,178,63,.06) 60%),var(--card);border:1px solid rgba(255,122,26,.45);animation:fadeup .6s var(--ease) both;box-shadow:0 20px 50px -24px rgba(255,122,26,.9)}
.raise .rr{display:flex;align-items:center;gap:10px;margin:12px 0;font:700 22px var(--fh)}
.raise .rr .from{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.okcard{background:linear-gradient(130deg,rgba(61,255,162,.16),transparent 70%),var(--card);border:1px solid rgba(61,255,162,.35)}
/* coach */
.coach{background:radial-gradient(400px 300px at 50% 0%,rgba(255,122,26,.1),transparent 70%),var(--bg)}
.coach .chat{flex:1 0 auto;padding:10px 16px 8px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:fadeup .4s var(--ease) both}
.msg .bub{padding:12px 14px;border-radius:20px 20px 20px 6px;background:var(--card2);border:1px solid var(--line);font-size:15px;line-height:1.45}
.msg .bub p+p{margin-top:6px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--grad);color:#1B0E00;border:0;border-radius:20px 20px 6px 20px;font-weight:500}
.msg.alertm .bub{border-color:rgba(255,92,122,.35);background:linear-gradient(120deg,rgba(255,92,122,.12),transparent),var(--card2)}
.msg .kav{width:34px;height:34px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.typing{display:flex;gap:4px;padding:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.cin{position:sticky;bottom:0;padding:8px 12px calc(var(--sb) + 8px);background:linear-gradient(180deg,rgba(10,11,15,0),var(--bg) 25%)}
.cin .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 4px 10px}
.cin .chips::-webkit-scrollbar{display:none}
.cin .chip{flex:none;background:rgba(255,122,26,.1);border-color:rgba(255,122,26,.3);color:#FFD0A6}
.cbar{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:5px 5px 5px 16px}
.cbar input{flex:1;background:none;border:0;outline:0;font-size:15px;min-height:40px;min-width:0}
.cbar input::placeholder{color:var(--dim)}
.cbar button{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#1B0E00;display:grid;place-items:center;flex:none}

/* ============ CARDS ============ */
.bcard{position:relative;width:100%;aspect-ratio:1.586;border-radius:24px;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#1B0E00;
  background:linear-gradient(135deg,#FF7A1A 0%,#FF9A2E 45%,#FFB23F 100%);box-shadow:0 30px 60px -24px rgba(255,122,26,.75),inset 0 1px 0 rgba(255,255,255,.5);transition:filter .5s,transform .5s var(--ease)}
.bcard .pat{position:absolute;inset:0;opacity:.9;pointer-events:none}
.bcard>*:not(.pat):not(.frost){position:relative}
.bcard .bt{display:flex;justify-content:space-between;align-items:flex-start}
.bcard .wm{font:800 24px var(--fh);letter-spacing:-1px}
.bcard .tag{font:700 13px var(--fb);letter-spacing:1px;background:rgba(0,0,0,.14);padding:4px 10px;border-radius:999px}
.bcard .num{font:600 20px var(--fh);letter-spacing:2px;font-variant-numeric:tabular-nums}
.bcard .bb{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;font-weight:600}
.bcard .bb .nm{font:600 15px var(--fh);letter-spacing:1px}
.bcard .chip2{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#FFE3B3,#E9B25B);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.bcard .frost{position:absolute;inset:0;background:linear-gradient(135deg,rgba(200,225,255,.55),rgba(140,180,230,.35));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .5s;font:700 15px var(--fh);z-index:2}
.bcard.frozen{filter:saturate(.25) brightness(.85)}
.bcard.frozen .frost{opacity:1}
.cacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cacts button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;min-height:88px;text-align:center}
.cacts button .ic{color:var(--or2)}
.cacts button.on{background:rgba(120,180,255,.12);border-color:rgba(120,180,255,.4)}
.cacts button.on .ic{color:#9CC8FF}
.wal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wal .btn{font-size:14px;min-height:52px;border-radius:16px}
.opt2{display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);text-align:left;transition:.25s}
.opt2+.opt2{margin-top:10px}
.opt2.on{border-color:var(--or1);background:linear-gradient(120deg,rgba(255,122,26,.1),var(--card) 70%)}
.opt2 .gi{width:48px;height:48px;border-radius:16px;background:var(--card2);display:grid;place-items:center;flex:none}
.opt2.on .gi{background:var(--grad);color:#1B0E00}
.opt2 b{display:block;font-size:16px}
.opt2 small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt2 .radio{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid #4a4f5d;flex:none}
.opt2.on .radio{border-color:var(--or1);background:var(--or1);box-shadow:inset 0 0 0 4px var(--card)}
.map{height:140px;border-radius:22px;margin-top:12px;position:relative;overflow:hidden;background:#151821;border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}

/* ============ REWARDS ============ */
.ward{background:radial-gradient(300px 200px at 30% 30%,rgba(255,122,26,.2),transparent 70%),linear-gradient(160deg,#1E2130,#14161D);border:1px solid var(--line2);border-radius:28px;padding:18px;display:flex;gap:10px;align-items:center}
.ward .kw{width:150px;height:150px;flex:none;margin:-10px -6px -10px -14px}
.swatches{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.swatches::-webkit-scrollbar{display:none}
.sw{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-align:center;min-height:88px}
.sw .sc{width:52px;height:52px;border-radius:50%;position:relative;border:2px solid transparent;transition:.25s;overflow:hidden}
.sw .sc svg{position:absolute;inset:0}
.sw.on .sc{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15),0 0 18px var(--swc)}
.sw.locked .sc{filter:grayscale(.85) brightness(.45)}
.sw .lk{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.quest .bar{height:8px;margin-top:8px}
.quest .qi{width:44px;height:44px;border-radius:14px;background:rgba(255,122,26,.13);color:var(--or2);display:grid;place-items:center;flex:none}
.quest.done .qi{background:rgba(61,255,162,.14);color:var(--mint)}
.invite{background:linear-gradient(140deg,rgba(255,122,26,.2),rgba(155,123,255,.12) 70%),var(--card);border:1px solid rgba(255,122,26,.35)}
.rule{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.25);font-size:14px;line-height:1.5}
.rule b{color:var(--or2)}
.code{display:flex;align-items:center;gap:10px;margin-top:12px;padding:6px 6px 6px 16px;border-radius:18px;background:rgba(0,0,0,.3);border:1.5px dashed rgba(255,178,63,.55)}
.code span{flex:1;font:700 22px var(--fh);letter-spacing:2px}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center;color:var(--muted)}
.badge .bd{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.badge.got{color:var(--text)}
.badge.got .bd{background:linear-gradient(135deg,rgba(255,122,26,.3),rgba(255,178,63,.12));border-color:rgba(255,178,63,.5);color:var(--or2);box-shadow:0 10px 26px -12px rgba(255,122,26,.8)}
.jungle{position:relative;margin:8px 16px 0;height:470px;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#2f5a2a,#14301a 60%,#0c1d10);cursor:crosshair;touch-action:manipulation}
.jungle .lf{position:absolute;pointer-events:none}
.jungle .hid{position:absolute;width:78px;height:78px;z-index:2;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.jungle .hid.found{transform:scale(1.5) rotate(0deg)!important;z-index:9}
.jungle .miss{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:2px solid rgba(255,255,255,.7);pointer-events:none;animation:missring .6s ease-out forwards;z-index:10}
@keyframes missring{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.foundcard{position:absolute;left:16px;right:16px;bottom:16px;z-index:12;animation:fadeup .5s var(--ease) both}
.kid{display:flex;gap:14px;align-items:center}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font:600 20px var(--fh)}
.stepper span{min-width:84px;text-align:center;font:600 16px var(--fh);font-variant-numeric:tabular-nums}
.lockchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:rgba(255,92,122,.1);color:#FF9FB2;font-size:13px;font-weight:600;border:1px solid rgba(255,92,122,.25)}

/* ============ PROFILE / CALL ============ */
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 20px 4px}
.phead .av{margin-bottom:12px}
.call{background:radial-gradient(500px 500px at 50% 30%,#2a2f45,#0c0d12 70%);align-items:center;text-align:center}
.call .ripple{position:relative;width:150px;height:150px;margin:60px auto 0;display:grid;place-items:center}
.call .ripple::before,.call .ripple::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,178,63,.4);animation:rip 2s ease-out infinite}
.call .ripple::after{animation-delay:1s}
.call.live .ripple::before,.call.live .ripple::after{animation:none;opacity:0}
@keyframes rip{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.call .self{position:absolute;right:20px;top:calc(var(--st) + 66px);width:96px;height:136px;border-radius:20px;background:linear-gradient(160deg,#3a2a20,#1c1f28);border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.callbar{display:flex;gap:18px;justify-content:center;padding:0 20px calc(var(--sb) + 24px)}
.callbar button{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.callbar button.off{background:#fff;color:#111}
.callbar .end{background:var(--red)}
.sres .li{border-top:1px solid var(--line)}
.faceid{width:104px;height:104px;margin:6px auto 12px;display:grid;place-items:center;border-radius:32px;background:rgba(255,122,26,.1);color:var(--or2);animation:holdpulse .5s ease-in-out infinite alternate}
.faceid.ok{background:rgba(61,255,162,.14);color:var(--mint);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.patria{background:linear-gradient(180deg,#0f1a2e,var(--bg) 40%)}

  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

    ao=outEl.animate([{transform:'none'},{transform:'translate3d(100%,0,0)'}],{duration:D,easing:E,fill:'forwards'});}

    if(outEl)ao=outEl.animate([{opacity:1,transform:'none'},{opacity:.4,transform:'scale(.96)'}],{duration:D,easing:E});}
  else if(type==='down'){ao=outEl.animate([{transform:'none'},{transform:'translate3d(0,100%,0)'}],{duration:D,easing:E,fill:'forwards'});

  w.innerHTML=`<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-panel" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-c">${html}</div></div>`;
  hydrateIcons(w); void w.offsetHeight; w.classList.add('open'); sheetOpen=true;
  mount&&mount($('.sheet-panel',w));
}
function sheetSet(html,mount){const c=$('#sheet .sheet-c');if(!c)return;c.innerHTML=html;hydrateIcons(c);mount&&mount(c);c.animate&&!RM.matches&&c.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:280,easing:'ease-out'})}
function closeSheet(instant){
  if(!sheetOpen)return; const w=$('#sheet'); w.classList.remove('open'); sheetOpen=false; const tok=++sheetTok;
  setTimeout(()=>{if(tok===sheetTok&&!sheetOpen)w.innerHTML=''},instant?0:420);
}
let toastT;
function toast(msg,icon='check',kind=''){
  const el=$('#toast'); el.className='toast '+kind; el.innerHTML=`<span class="ti">${ic(icon,16,2.2)}</span><span>${msg}</span>`;
  void el.offsetHeight; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2800);
}
function countUps(root){
  $$('[data-count]',root).forEach(el=>{
    const to=+el.dataset.count, key=el.dataset.key, from=key in shown?shown[key]:to; shown[key]=to;
    if(from===to||RM.matches){el.textContent=num(to);return}
    el.textContent=num(from); const t0=performance.now(), D=900;
    const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.textContent=num(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
function confetti(){
  if(RM.matches)return; const box=document.createElement('div'); box.className='confetti'; $('#screen').appendChild(box);
  const cols=['#FF7A1A','#FFB23F','#3DFFA2','#FF5FA2','#5B8CFF','#fff'];
  for(let i=0;i<70;i++){
    const c=document.createElement('i'); c.style.left=(Math.random()*100)+'%'; c.style.background=cols[i%cols.length];
    box.appendChild(c); const dx=(Math.random()-.5)*160, rot=Math.random()*720-360, d=1800+Math.random()*1400;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${880+Math.random()*80}px) rotate(${rot}deg)`,opacity:.9}],{duration:d,delay:Math.random()*400,easing:'cubic-bezier(.25,.6,.4,1)',fill:'forwards'});
  }
  setTimeout(()=>box.remove(),3800);
}

function donut(mix,size=110){
  let a=0; const r=40, C=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="transform:rotate(-90deg)" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#262a35" stroke-width="14"/>${mix.map(([n,p,c])=>{const len=C*p/100;const s=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${c}" stroke-width="14" stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-a}"/>`;a+=len;return s}).join('')}</svg>`;
}
function spark(hist,w=350,h=96,down){
  const v=hist.length>1?hist:[hist[0]||0,hist[0]||0]; const mn=Math.min(...v), mx=Math.max(...v), rg=(mx-mn)||1;
  const pts=v.map((y,i)=>[i/(v.length-1)*w, h-8-((y-mn)/rg)*(h-22)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last=pts[pts.length-1], col=down?'#FF5C7A':'#3DFFA2';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#${down?'g-area-r':'g-area'})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0]-4}" cy="${last[1]}" r="4.5" fill="${col}"/><circle cx="${last[0]-4}" cy="${last[1]}" r="10" fill="${col}" opacity=".2"/></svg>`;
}
function qrSvg(seed=7,size=200,color='#111'){
  let s=seed; const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const N=25, finder=(x,y)=>x<7&&y<7||x>=N-7&&y<7||x<7&&y>=N-7; let d='';
  const f=(ox,oy)=>`M${ox} ${oy}h7v7h-7zM${ox+1} ${oy+1}v5h5v-5zM${ox+2} ${oy+2}h3v3h-3z`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(finder(x,y)||(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8))continue;if(rnd()>.52)d+=`M${x} ${y}h1v1h-1z`}
  return `<svg width="${size}" height="${size}" viewBox="-1 -1 27 27" aria-label="QR code (example)" role="img"><path d="${f(0,0)}${f(N-7,0)}${f(0,N-7)}${d}" fill="${color}" fill-rule="evenodd"/></svg>`;
}
const catIc={work:'work',coffee:'coffee',cart:'cart',car:'car',food:'food',tv:'tv',send:'send',req:'req',invest:'invest',plus:'plus',jar:'jar'};
function txRow(tx,i){
  return `<button class="li" data-act="txInfo" data-a="${i}"><span class="ico" ${tx.amt>0?'style="background:rgba(61,255,162,.12);color:var(--mint)"':''}>${ic(catIc[tx.cat]||'card',20)}</span><span class="t"><b>${esc(tx.name)}</b><small>${esc(tx.sub||'')}</small></span><span class="r"><b class="${tx.amt>0?'pos':''}">${fmt(tx.amt,true)}</b>${tx.ru?`<small class="ru">+${tx.ru} Kč rounded up</small>`:''}</span></button>`;
}
function txList(list){let out='',last='';list.forEach((tx,i)=>{if(tx.day!==last){out+=`<div class="day">${tx.day}</div>`;last=tx.day}out+=txRow(tx,i)});return out}

  mount(el){mountHold($('#hold',el),()=>{startPlan();later(()=>go('inv-success',{},{t:'fade'}),350)})}};
function mountHold(btn,onDone){
  if(!btn)return; let raf,t0=0,prog=0,holding=false,done=false; const DUR=1000;
  const fill=$('.hold-fill',btn), lbl=$('.hold-lbl',btn);
  const set=v=>{prog=v;fill.style.transform=`scaleX(${v})`};
  const step=now=>{if(!holding)return;set(Math.min(1,(now-t0)/DUR));if(prog>=1){holding=false;done=true;btn.classList.remove('holding');btn.classList.add('full');lbl.textContent='Starting…';vib([20,40,30]);onDone();return}raf=requestAnimationFrame(step)};
  const start=e=>{if(done||holding)return;if(e.cancelable)e.preventDefault();holding=true;t0=performance.now()-prog*DUR;lbl.textContent='Keep holding…';btn.classList.add('holding');vib(10);
    if(e.pointerId!=null){try{btn.setPointerCapture(e.pointerId)}catch(_){}} raf=requestAnimationFrame(step)};
  const cancel=()=>{if(!holding)return;holding=false;cancelAnimationFrame(raf);btn.classList.remove('holding');lbl.textContent='Hold to start plan';
    const from=prog,t1=performance.now();const bk=now=>{if(holding||done)return;const k=Math.min(1,(now-t1)/260);set(from*(1-k));if(k<1)requestAnimationFrame(bk)};requestAnimationFrame(bk)};
  btn.addEventListener('pointerdown',start);
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,cancel));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e)});
  btn.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')cancel()});
}
function startPlan(silent){
  const d=S.draft,p=S.pocket; if(!d.profile)d.profile='balanced';
  Object.assign(p,{active:true,goal:d.goal,pct:d.pct,roundups:d.roundups,cashback:d.cashback,dip:d.dip,profile:d.profile,paused:false,startMi:S.mi,
    drop:false,payRise:false,payRiseDone:false,payRiseHidden:false});
  const first=monthly(p); p.invested=first; p.value=first; p.months=1; p.streak=1; p.history=[0,first];
  S.main-=planAmt(p.pct);

  dip:{q:'How does DIP save tax?',a:()=>[`DIP is a Czech long-term investment account.`,`What you put in — up to 48 000 Kč a year — can be deducted from your tax base. At 15% tax that’s up to 7 200 Kč back.`,`The deal: keep it at least 10 years and until you’re 60. Leave earlier and the tax benefit is paid back.`]},
  pause:{q:'Can I pause my plan?',a:()=>[`Yes — anytime, with no fee.`,`Your money stays invested while the plan is paused, and you can restart with one tap.`,`Your streak simply waits for you, and your badges stay.`],acts:[['sliders','Plan settings','go:profile']]},

const DROP_MSG='Markets fell 4% this week. Your plan keeps buying at lower prices. Your goal date has not changed.';
function coachAnswer(text){
  const s=text.toLowerCase();
  if(/sell|prod|panic|lose|loss/.test(s))return COACH.sell;
  if(/etf|fund|fond/.test(s))return COACH.etf;
  if(/dip|tax|dan|daň/.test(s))return COACH.dip;
  if(/pause|stop|cancel|break/.test(s))return COACH.pause;
  if(/fee|cost|poplat/.test(s))return {a:()=>[`This example plan has a 0 Kč minimum fee and an example annual fee of 0.5%.`,`On 10 000 Kč invested, that’s about 50 Kč a year. There are no fees for pausing or changing your plan.`]};
  return {a:()=>[`Good question! I’m a prototype coach, so today I only know a few topics — try one of the suggestions below.`,`For anything personal or more complex, a human advisor is one video call away.`],acts:[['video','Talk to a human','go:call']]};
}
function msgHtml(m){
  if(m.me)return `<div class="msg me"><div class="bub">${esc(m.text)}</div></div>`;
  return `<div class="msg ${m.alert?'alertm':''}">${kav(34)}<div class="bub">${m.lines.map(l=>`<p>${l}</p>`).join('')}${m.acts?`<div class="acts">${m.acts.map(a=>`<button class="chip" data-act="route" data-a="${a[2]}">${ic(a[0],16)}${a[1]}</button>`).join('')}</div>`:''}</div></div>`;
}

  key(k){const tv=topView();if(!tv||tv.id!=='pay-amount')return;let a=tv.p.amt||'';if(k==='⌫')a=a.slice(0,-1);else if(a.length<6&&!(a===''&&k==='0'))a+=k;tv.p.amt=a;updAmt(tv.el,tv.p);vib(5)},
  amtGo(){const tv=topView(),p=tv.p,amt=+p.amt;if(!amt)return;const c=CONTACTS[+p.c||0];
    if(p.mode==='request'){S.notifs.unshift({i:'req',t:`You requested ${fmt(amt)} from ${c.n}`,s:'Just now'});go('pay-done',{mode:'request',c:p.c,amt},{replace:true});return}
    if(amt>S.main){toast('That’s more than your balance','info','warn');return}
    sheet(`<div class="center"><h3>Approve payment</h3><p class="muted">to ${c.n} · instant payment</p><div class="mt16" style="display:flex;justify-content:center">${money(amt)}</div></div>
      <div class="card c2 mt16 sum"><div class="row"><span>From</span><span>Main account</span></div><div class="row"><span>Arrives</span><span class="pos">In seconds</span></div>${p.note?`<div class="row"><span>Note</span><span>${p.note}</span></div>`:''}</div>
      <button class="btn mt16" data-act="approve" data-a="send:${amt}:${+p.c||0}:${p.note||''}">${ic('face',20)}Approve with Face ID</button>
      <p class="disc center mt12">Approved right here — no second app needed.</p>`)},
  approve(a){const [kind,amtS,cS,note]=a.split(':'),amt=+amtS,c=CONTACTS[+cS||0];
    const label=kind==='qr'?`Paying Kafe Lab ${fmt(amt)}`:`Sending ${fmt(amt)} to ${c.n}`;
    if(sheetOpen)sheetSet(faceHtml(false,label));else sheet(faceHtml(false,label));
    setTimeout(()=>sheetSet(faceHtml(true,label)),RM.matches?100:900);
    setTimeout(()=>{const ru=(10-amt%10)%10;S.main-=amt;
      S.tx.unshift(kind==='qr'?{day:'Today',name:'Kafe Lab',sub:'QR payment',cat:'coffee',amt:-amt,ru}:{day:'Today',name:'To '+c.n,sub:'Instant payment'+(note?' · '+note:''),cat:'send',amt:-amt,ru});
      go('pay-done',{mode:kind,c:cS,amt},{replace:true,force:true});},RM.matches?300:1500)},
  payDone(){go(stack[0]&&SCREENS[stack[0].id].tab?stack[0].id:'payments',{},{reset:true,t:'fade'})},
  copyLink(){copyText('csobi.app/pay/ADAM-'+(topView().p.amt||''));toast('Pay link copied','copy')},
  qrMode(m){topView().p.my=m==='my';refresh()},
  shareMock(){sheet(`<h3>Share</h3><p class="muted">Mock share sheet.</p>${shareTargets('shared')}`)},
  shared(t){closeSheet();toast(`Shared via ${t} (mock)`,'share')},
  splitBill(i){topView().p.b=+i;refresh()},
  splitWho(i){const p=topView().p;i=+i;p.sel=p.sel.includes(i)?p.sel.filter(x=>x!==i):[...p.sel,i];refresh()},
  splitGo(){const p=topView().p;if(!p.sel.length)return;S.notifs.unshift({i:'split',t:`Split sent to ${p.sel.length} friends`,s:'Just now'});go('pay-done',{mode:'split',amt:p.share,n:p.sel.length},{replace:true})},
  /* invest */
  pickGoal(k,el){S.draft.goal=k;$$('.goal',topView().el).forEach(g=>{const on=g.dataset.a===k;g.classList.toggle('on',on);g.setAttribute('aria-pressed',on)});vib(8)},
  dtog(k,el){S.draft[k]=!S.draft[k];const v=topView();const d=SCREENS[v.id];if(d.update)d.update(v.el);else flipRow(el,S.draft[k])},
  dtogR(k){S.draft[k]=!S.draft[k];refresh()},
  toSuit(){const d=S.draft;if(!d.profile){d.q=0;d.answers=[null,null,null]}else d.q=3;go('inv-suit')},
  answer(i,el){const d=S.draft;if(d.q>2)return;d.answers[d.q]=+i;el.classList.add('on');vib(8);
    later(()=>{d.q++;if(d.q===3)d.profile=scoreProfile(d.answers);refresh();topView().el.scrollTop=0},RM.matches?0:240)},
  qBack(){S.draft.q=Math.max(0,S.draft.q-1);refresh()},
  retake(){Object.assign(S.draft,{q:0,answers:[null,null,null],profile:null});refresh()},
  retakeFromPocket(){const cur=S.pocket.profile;sheet(`<h3>Change your mix</h3><p class="muted">Your check suggested <b style="color:var(--text)">${PROFILES[S.draft.profile||cur].name}</b>. Future buys use the mix you pick.</p>
    <div class="mt16">${Object.entries(PROFILES).map(([k,pr])=>`<button class="opt2 ${cur===k?'on':''}" data-act="setProfile" data-a="${k}"><span class="gi">${donut(pr.mix,40)}</span><span><b>${pr.name}</b><small>${pr.mix.map(m=>m[1]+' % '+m[0]).join(' · ')}</small></span><span class="radio"></span></button>`).join('')}</div>`)},
  setProfile(k){S.pocket.profile=k;closeSheet();refresh();toast(`Mix changed to ${PROFILES[k].name}`)},
  toPocket(){go('pocket',{},{reset:true,t:'fade'})},
  raise(){const p=S.pocket;p.pct=Math.min(15,p.pct+1);p.payRiseDone=true;S.notifs.unshift({i:'invest',t:`Plan raised to ${p.pct} %`,s:'Just now'});vib([15,40,15]);refresh();toast(`Plan raised to ${p.pct} % · ${fmt(planAmt(p.pct))} every payday`,'invest')},
  raiseHide(){S.pocket.payRiseHidden=true;refresh()},
  openPatria(){toast('In the live app this opens Patria. Prototype ends here.','info','or')},
  ask(k){coachSay(COACH[k].q,COACH[k])},
  /* cards */
  reveal(){S.card.reveal=!S.card.reveal;refresh();if(S.card.reveal)toast('Card details shown · protected by Face ID','eye')},
  freeze(){S.card.frozen=!S.card.frozen;refresh();toast(S.card.frozen?'Card frozen — unfreeze anytime':'Card unfrozen, ready to pay','snow',S.card.frozen?'or':'')},
  limits(){const l=S.card.limits;const row=(k,n,max)=>`<div class="mt16"><div class="row"><span class="lbl">${n}</span><b id="lv-${k}">${fmt(l[k])}</b></div><input type="range" class="range" min="0" max="${max}" step="1000" value="${l[k]}" data-k="${k}" style="--p:${l[k]/max*100}%" aria-label="${n}"></div>`;
    sheet(`<h3>Card limits</h3><p class="muted">Per day. Changes apply instantly.</p>${row('pay','Card payments',100000)}${row('online','Online',100000)}${row('atm','Cash withdrawals',50000)}<button class="btn mt20" data-act="saveLimits">Save limits</button>`,
      panel=>$$('input[type=range]',panel).forEach(r=>r.addEventListener('input',()=>{S.card.limits[r.dataset.k]=+r.value;r.style.setProperty('--p',r.value/r.max*100+'%');$('#lv-'+r.dataset.k,panel).textContent=fmt(+r.value)})))},
  saveLimits(){closeSheet();toast('Limits saved')},
  wallet(w){const name=w==='apple'?'Apple Pay':'Google Pay';if(S.card[w]){toast(`Already in ${name}`);return}
    sheet(`<div class="center" style="padding:12px 0"><div class="spinner"></div><h3 class="mt16">Adding to ${name}…</h3><p class="muted">Mock wallet provisioning</p></div>`);
    setTimeout(()=>{S.card[w]=true;if(topView().id==='cards')refresh();sheetSet(`<div class="center" style="padding:12px 0"><div class="faceid ok">${ic('check',52,2.4)}</div><h3>Added to ${name}</h3><p class="muted">Pay with your phone or watch, today.</p></div><button class="btn mt16" data-act="closeSheet">Done</button>`)},1300)},
  cardTog(k,el){S.card[k]=!S.card[k];flipRow(el,S.card[k]);toast(`${k==='online'?'Online payments':'Contactless'} ${S.card[k]?'on':'off'}`,S.card[k]?'check':'lock',S.card[k]?'':'or')},
  pin(){sheet(`<div class="center"><h3>Your PIN</h3><p class="muted">Make sure nobody is watching.</p><div class="big mt20" id="pinv" style="letter-spacing:14px">••••</div></div><button class="btn mt20" data-act="pinShow">${ic('face',20)}Reveal with Face ID</button>`)},
  pinShow(_,el){const v=$('#pinv');if(v)v.textContent='4819';el.disabled=true;setTimeout(()=>{const v2=$('#pinv');if(v2)v2.textContent='••••'},4000)},
  orderCard(){go('card-order')},
  orderMode(m){S.card.orderMode=m;refresh()},
  branch(i){S.card.branch=+i;refresh()},
  orderGo(){S.card.physical=S.card.orderMode;const m=S.card.physical==='post'?'Card ordered — arriving in 3–5 days':`Reserved at ${BRANCHES[S.card.branch].n} · ready today`;back();setTimeout(()=>toast(m,S.card.physical==='post'?'truck':'store'),300)},
  /* rewards */
  shirt(k){const r=S.rewards;if(!unlockedShirts().includes(k)){const n=SHIRTS[k].need-S.pocket.streak;toast(`Invest ${n} more month${n===1?'':'s'} in a row to unlock`,'lock','or');return}
    r.shirt=k;const el=topView().el;const svg=$('#wk svg',el);svg&&svg.style.setProperty('--shirt',SHIRTS[k].c);
    $$('.sw',el).forEach(s=>s.classList.toggle('on',s.dataset.a===k));const h=$('.ward .h3',el);if(h)h.textContent=SHIRTS[k].n;
    if(svg&&!RM.matches)svg.animate([{transform:'scale(1)'},{transform:'scale(1.08) rotate(-3deg)'},{transform:'scale(1)'}],{duration:450,easing:'ease-out'});vib(8)},
  copyCode(){copyText('ADAM-27KB');S.rewards.copied=true;refresh();toast('Code ADAM-27KB copied','copy')},
  invite(){sheet(`<h3>Invite a friend</h3><p class="muted">“Join me on ČSOBi! Use code ADAM-27KB. Start a plan, invest 3 months, and we both get 500 Kč in ETF.”</p>${shareTargets('inviteSent')}`)},
  inviteSent(t){S.rewards.invited=true;closeSheet();refresh();toast(`Invite sent via ${t}`,'send2')},
  miss(_,el,e){if(S.rewards.found)return;const j=$('#jungle',topView().el);const r=j.getBoundingClientRect();const sc=r.width/j.offsetWidth||1;
    const m=document.createElement('span');m.className='miss';m.style.left=(e.clientX-r.left)/sc+'px';m.style.top=(e.clientY-r.top)/sc+'px';j.appendChild(m);setTimeout(()=>m.remove(),650);
    S._miss=(S._miss||0)+1;const t=$('#misses',topView().el);if(t)t.textContent=S._miss>=3?'Hint: he’s in the lower left. Look for the eye.':`Not there… (${S._miss})`;vib(5)},
  found(_,el){if(S.rewards.found)return;S.rewards.found=true;addBadge('sharp');const svg=$('svg',el);svg.style.setProperty('--skin','url(#kg-orange)');svg.style.setProperty('--shirt',SHIRTS[S.rewards.shirt].c);
    el.classList.add('found');const j=$('#jungle',topView().el);j.insertAdjacentHTML('beforeend',foundCard());hydrateIcons(j);$('#misses',topView().el).textContent='Found him!';confetti();vib([20,40,20])},
  /* family */
  kidSend(){const k=S.kids;S.main-=k.pocket;k.balance+=k.pocket;S.tx.unshift({day:'Today',name:'To Ema · pocket money',sub:'Kids jar',cat:'jar',amt:-k.pocket});refresh();toast(`${fmt(k.pocket)} sent to ${k.name}`,'jar')},
  kidJarAdd(){const k=S.kids;S.main-=200;k.jar+=200;refresh();toast(`200 Kč invested for ${k.name}`,'invest')},
  kidTog(k,el){S.kids[k]=!S.kids[k];flipRow(el,S.kids[k])},
  kidPocket(d){const k=S.kids;k.pocket=Math.max(50,Math.min(500,k.pocket+ +d));refresh()},
  /* profile */
  pauseTog(_,el){const p=S.pocket;p.paused=!p.paused;flipRow(el,!p.paused);toast(p.paused?'Plan paused — your money stays invested':'Plan active again',p.paused?'pause':'play',p.paused?'or':'')},
  pct(d){const p=S.pocket;p.pct=Math.max(1,Math.min(15,p.pct+ +d));refresh()},
  prefTog(k,el){S.prefs[k]=!S.prefs[k];flipRow(el,S.prefs[k])},
  devices(){sheet(`<h3>Trusted device</h3><p class="muted">Payments are approved inside ČSOBi on this phone only.</p><div class="card c2 mt16 sum"><div class="row"><span>Device</span><span>This phone</span></div><div class="row"><span>Added</span><span>Today, 7:00</span></div><div class="row"><span>Approval</span><span>Face ID + PIN</span></div></div><button class="btn sec mt16" data-act="closeSheet">OK</button>`)},
  lang(l){S.lang=l;$$('[data-l]').forEach(e=>e.textContent=t(e.dataset.l));refresh();toast(l==='cs'?'Čeština zapnuta (prototyp: hlavní popisky)':'English on','globe')},
  callTog(_,el){el.classList.toggle('off')},
  /* demo */
  demo(){$('#demo').classList.toggle('open');updateDemoState()},
  dRestart(){S=initState();window.S=S;for(const k in shown)delete shown[k];$('#demo').classList.remove('open');$$('[data-l]').forEach(e=>e.textContent=t(e.dataset.l));closeSheet(true);busy=false;go('splash',{},{reset:true,t:'fade',force:true});toast('Demo restarted','restart','or')},
  dSkip(){
    const p=S.pocket; if(!p.active)quickStart(); const rets=[.009,-.004,.012,.006,.01,.003];
    const before=unlockedShirts();
    for(let i=0;i<6;i++){S.mi++;const c=p.paused?0:monthly(p);p.value=p.value*(1+rets[i])+c;p.invested+=c;p.months++;if(!p.paused)p.streak=Math.min(12,p.streak+1);p.history.push(p.value)}
    S.salary=40500; p.payRise=true; p.payRiseDone=false; p.payRiseHidden=false; p.drop=false;
    if(p.streak>=3)addBadge('streak3'); if(p.streak>=6)addBadge('streak6');
    const nu=unlockedShirts().filter(k=>!before.includes(k));
    S.tx.unshift({day:'Today',name:'Salary · Nordlight s.r.o.',sub:'Pay rise!',cat:'work',amt:40500});
    S.notifs.unshift({i:'spark',t:'Pay rise spotted: 40 500 Kč',s:'Today'},{i:'invest',t:'6 payday buys done',s:'This month'});
    $('#demo').classList.remove('open'); busy=false;
    go('pocket',{},{reset:true,t:'fade',force:true});
    setTimeout(()=>toast(`+6 months: 6 payday buys done${nu.length?' · new shirts: '+nu.map(k=>SHIRTS[k].n).join(', '):''}`,'forward','or'),350);
  },
  dDrop(){
    const p=S.pocket; if(!p.active)quickStart(); const b=p.value; p.value=Math.round(p.value*.96); p.dropAmt=b-p.value; p.history.push(p.value); p.drop=true; S.tipIdx=0;
    const last=S.coach[S.coach.length-1]; if(!last||last.lines?.[0]!==DROP_MSG)S.coach.push({lines:[DROP_MSG],alert:true});
    S.notifs.unshift({i:'down',t:'Markets fell 4% this week — your plan keeps going',s:'Just now'}); S.unread=true;
    $('#demo').classList.remove('open'); busy=false;
    go('pocket',{},{reset:true,t:'fade',force:true});
    setTimeout(()=>{if(topView()&&topView().id==='pocket')go('coach',{},{t:'up',force:true})},1500);
  },
  jump(id){
    $('#demo').classList.remove('open'); const def=SCREENS[id]; busy=false;
    if(def.tab||id==='splash'||id==='onb1'){if(id==='onb1'){go('splash',{},{reset:true,instant:true,force:true});go('onb1',{},{force:true})}else go(id,{},{reset:true,t:'fade',force:true});return}
    const roots={'pay-pick':'payments','pay-amount':'payments',qr:'payments',split:'payments','inv-goal':'invest','inv-plan':'invest','inv-dip':'invest','inv-suit':'invest','inv-confirm':'invest',
      'inv-success':'invest',coach:'invest',patria:'invest','card-order':'cards',findkamil:'rewards',family:'rewards',profile:'home',call:'home',search:'home'};
    let root=roots[id]||'home'; if(root==='invest')root=(S.pocket.active||id==='coach'||id==='patria'||id==='inv-success')?(id==='inv-success'?'invest':'pocket'):'invest';
    if(id==='inv-success')quickStart();
    if(id==='inv-suit'&&S.draft.q>3)S.draft.q=0;
    go(root,{},{reset:true,instant:true,force:true});
    go(id,id==='pay-pick'?{mode:'send'}:{},{t:id==='coach'?'up':'push',force:true});
  },
};

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-go]'); if(!el||el.disabled)return;
  if(el.dataset.act){const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset.a,el,e)}return}
  if(el.dataset.go)go(el.dataset.go,parseP(el.dataset.p),{t:el.dataset.t});
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(); const typing=tag==='input'||tag==='textarea';
  if(e.key==='Escape'){if($('#demo').classList.contains('open'))$('#demo').classList.remove('open');else back();return}
  if((e.key==='Enter'||e.key===' ')&&!typing&&e.target.matches('[data-act]:not(button),[data-go]:not(button)')){e.preventDefault();e.target.click();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  const tv=topView();
  if(tv&&tv.id==='pay-amount'&&(/^[0-9]$/.test(e.key)||e.key==='Backspace')){A.key(e.key==='Backspace'?'⌫':e.key);return}
  const k=e.key.toLowerCase();
  if(k==='d')A.demo(); else if(k==='r')A.dRestart(); else if(k==='s')A.dSkip(); else if(k==='m')A.dDrop();
});

/* ---------- Demo panel state ---------- */
const JUMPS=[['splash','Splash'],['onb1','Onboarding'],['home','Home'],['search','Search'],['payments','Payments'],['pay-pick','Send'],['qr','QR pay'],['split','Split bill'],['invest','Invest intro'],
  ['inv-goal','Goal'],['inv-plan','Plan'],['inv-dip','DIP'],['inv-suit','Suitability'],['inv-confirm','Confirm'],['inv-success','Success'],['pocket','Pocket'],['coach','AI coach'],['patria','Patria'],
  ['cards','Cards'],['card-order','Order card'],['rewards','Rewards'],['findkamil','Find Kamil'],['family','Kids jar'],['profile','Profile'],['call','Video call']];
$('#jump').innerHTML=JUMPS.map(([id,n])=>`<button data-act="jump" data-a="${id}">${n}</button>`).join('');
function updateDemoState(){
  const el=$('#demoState'); if(!el||!$('#demo').classList.contains('open'))return; const p=S.pocket, tv=topView();
  el.innerHTML=`Screen: <b>${tv?SCREENS[tv.id].title||tv.id:'—'}</b><br>Pocket: ${p.active?`${fmt(p.value)} · ${p.streak}-month streak · ${p.pct} %${p.drop?' · after −4 %':''}`:'not started'}<br>Salary: ${fmt(S.salary)} · Main: ${fmt(S.main)}`;
}

/* ---------- Phone frame scaling ---------- */
function fit(){const d=$('#device');if(MOBILE.matches){d.style.transform='';return}
  const s=Math.min(1,(innerHeight-64)/(844+28),(innerWidth-40)/(390+28));d.style.transform=`scale(${s})`}
addEventListener('resize',fit); fit();

/* ---------- Boot ---------- */
hydrateIcons(document);
go('splash',{},{reset:true,instant:true});
</script>
